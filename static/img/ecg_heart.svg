<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Heart Background with shadow -->
  <path d="M 100,170 C 25,115 15,60 55,30 C 80,10 95,25 100,40 C 105,25 120,10 145,30 C 185,60 175,115 100,170 Z" 
        fill="url(#heartGrad)" filter="url(#glow)"/>

  <!-- ECG Pulse Line -->
  <path d="M 30,100 L 65,100 L 75,85 L 85,118 L 98,52 L 112,138 L 122,92 L 130,105 L 140,100 L 170,100" 
        fill="none" stroke="url(#ecgGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>